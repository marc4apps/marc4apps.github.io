<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The personal webpage of Marc Apps">
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <title>MARC APPS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="https://live.staticflickr.com/65535/53334614383_1bbf901061_o.png">

    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e1b4b;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --accent: #818cf8;
            --card: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 28px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .photo {
            width: 128px;
            height: 128px;
            object-fit: cover;
        }

        .name {
            margin-top: 24px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .tagline {
            margin-top: 12px;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--muted);
        }

        .links {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.2s, border-color 0.2s;
        }

        .btn:hover,
        .btn:focus-visible {
            background: rgba(129, 140, 248, 0.25);
            border-color: var(--accent);
            transform: translateY(-2px);
            outline: none;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        footer {
            padding: 20px 16px 28px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        @media (max-width: 400px) {
            .card { padding: 32px 20px; }
            .name { font-size: 1.6rem; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <section class="main">
        <div class="container">
            <div class="card">
                <img src="https://live.staticflickr.com/65535/53334614383_1bbf901061_o.png" class="photo" alt="Marc Apps logo">
                <h1 class="name">MARC APPS</h1>
                <p class="tagline">Our goal is to create the best apps that help you get the most out of your device.</p>

                <div class="links">
                    <a class="btn" href="mailto:hasnaalayaal@gmail.com">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
                        Contact
                    </a>
                    <a class="btn" href="https://marc4apps.github.io/privacypolicy.html" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
                        Privacy Policy
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026-2027 MARC APPS</p>
    </footer>
</body>
</html>
